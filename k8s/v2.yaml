apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-v2
  template:
    metadata:
      labels:
        app: exam-v2
    spec:
      containers:
        - name: exam
          image: shivanesh77/online-exam:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: exam-v2-svc
spec:
  type: LoadBalancer
  selector:
    app: exam-v2
  ports:
    - port: 8082
      targetPort: 5000
